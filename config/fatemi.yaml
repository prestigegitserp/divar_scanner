project:
  name: "Tehran Fatemi Rental System-One Scanner"
  random_seed: 42

crawl:
  city_id: "1"
  city_slug: "tehran"
  category: "apartment-rent"
  district_query: "فاطمی"
  district_aliases:
    - "فاطمی"
    - "میدان فاطمی"
    - "دکتر فاطمی"
  max_listings: 500
  max_pages: 50
  request_delay_seconds: 1.2
  jitter_seconds: 0.35
  timeout_seconds: 25
  user_agent: "divar-scanner-research/0.4 (+public listing analysis)"
  redact_phone_numbers: true
  cache_dir: "data/cache"
  raw_dir: "data/raw"

features:
  rent_to_deposit_multiplier: 30.0
  rent_to_deposit_multipliers: [25.0, 30.0, 35.0]
  area_min: 10
  area_max: 1000
  rooms_max: 12
  shamsi_year_min: 1300
  shamsi_year_max: 1410
  area_bucket_size: 20

anomaly:
  robust_z_clip: 8.0
  peer_min_count: 8
  isolation_contamination: "auto"
  duplicate_similarity_threshold: 0.88
  duplicate_max_features: 12000

decision:
  enabled: true

  # Primary engine: native non-autoregressive System-One decision model.
  # mmBERT encoder + typed decision head, no token generation.
  backend: "laya-multilingual"
  laya_model_id: "convaiinnovations/laya"
  laya_subfolder: "multilingual"

  # Robustness against option-position bias:
  # every logical choice/score/noul is transported as opaque bounded choices
  # and pooled over deterministic option permutations.
  permutation_passes: 2

  # NLI baselines remain only for research comparisons, not as the default engine.
  model_override: null
  ensemble_backends:
    - "mdeberta-nli"
    - "parsbert-parsinlu"
  ensemble_weights:
    mdeberta-nli: 0.55
    parsbert-parsinlu: 0.45

  calibration_file: "config/fatemi_calibration.json"
  device: "auto"
  strict: true

  # Selection: high-risk candidates + stratified exploration across the score range.
  top_k: 60
  exploration_sample: 24
  exploration_bins: 6
  min_prefilter_score: 0.24

  max_length: 1024
  batch_size: 24

  # Selective prediction / abstention policy.
  min_effective_confidence: 0.58
  min_coherence: 0.55
  min_order_stability: 0.80

  # Target-domain temperatures; a labelled calibration file overrides per question.
  temperatures:
    choice: 1.0
    score: 1.0
    noul: 1.0

scoring:
  # Data-quality channel
  data_rule_weight: 0.72
  data_decision_weight: 0.28

  # Market-outlier channel
  market_stat_weight: 0.82
  market_decision_weight: 0.18

  # Misleading/bait channel: intentionally no single-listing market score.
  misleading_duplicate_weight: 0.42
  misleading_decision_weight: 0.58

  # Abstention increases review priority, not fraud suspicion.
  abstain_review_uplift: 0.08

  review_threshold: 0.55
  high_risk_threshold: 0.75

output:
  directory: "outputs/fatemi"
  write_csv: true
  write_parquet: true
  write_html_report: true
