project:
  name: "Tehran Fatemi Rental Anomaly Scanner"
  random_seed: 42

crawl:
  city_id: "1"
  city_slug: "tehran"
  category: "apartment-rent"
  district_query: "فاطمی"
  district_aliases:
    - "فاطمی"
    - "میدان فاطمی"
    - "دکتر فاطمی"
  max_listings: 500
  max_pages: 50
  request_delay_seconds: 1.2
  jitter_seconds: 0.35
  timeout_seconds: 25
  user_agent: "divar-scanner-research/0.3 (+public listing analysis)"
  redact_phone_numbers: true
  cache_dir: "data/cache"
  raw_dir: "data/raw"

features:
  rent_to_deposit_multiplier: 30.0
  rent_to_deposit_multipliers: [25.0, 30.0, 35.0]
  area_min: 10
  area_max: 1000
  rooms_max: 12
  shamsi_year_min: 1300
  shamsi_year_max: 1410
  area_bucket_size: 20

anomaly:
  robust_z_clip: 8.0
  peer_min_count: 8
  isolation_contamination: "auto"
  duplicate_similarity_threshold: 0.88
  duplicate_max_features: 12000

decision:
  enabled: true
  backend: "mdeberta-nli"
  # Optional: set model_override only when intentionally replacing the registry model.
  model_override: null
  # Alternative non-generative backends:
  #   parsbert-parsinlu  (Persian specialist; CC-BY-NC-SA-4.0)
  #   mbert-parsinlu     (Persian specialist; CC-BY-NC-SA-4.0)
  #   persian-ensemble   (fuses mDeBERTa + ParsBERT evidence before option softmax)
  ensemble_backends:
    - "mdeberta-nli"
    - "parsbert-parsinlu"
  ensemble_weights:
    mdeberta-nli: 0.55
    parsbert-parsinlu: 0.45
  calibration_file: null
  device: "auto"
  strict: true
  top_k: 60
  min_prefilter_score: 0.24
  max_length: 512
  batch_size: 24
  temperatures:
    choice: 1.0
    score: 1.0
    noul: 1.0

scoring:
  data_quality_weight: 0.22
  market_anomaly_weight: 0.38
  duplicate_weight: 0.16
  decision_weight: 0.24
  review_threshold: 0.58
  high_risk_threshold: 0.78

output:
  directory: "outputs/fatemi"
  write_csv: true
  write_parquet: true
  write_html_report: true
