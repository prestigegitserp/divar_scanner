name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Packaging/import smoke test
        run: |
          python - <<'PY'
          import pathlib
          import divar_scanner
          import divar_scanner.pipeline
          import pandas, numpy, sklearn, pyarrow
          p = pathlib.Path(divar_scanner.__file__).resolve().as_posix()
          print("package:", p)
          print("pandas:", pandas.__version__)
          print("numpy:", numpy.__version__)
          assert "/src/divar_scanner/" in p
          PY
      - run: pytest
      - run: python -m compileall -q src

  colab-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Simulate safe Colab clone directory
        run: |
          mkdir -p /tmp/content
          cp -R "$GITHUB_WORKSPACE" /tmp/content/divar_scanner_repo
          cd /tmp/content/divar_scanner_repo
          python -m pip install -e .
          cd /tmp/content
          PYTHONPATH=/tmp/content/divar_scanner_repo/src python -m divar_scanner.doctor
          PYTHONPATH=/tmp/content/divar_scanner_repo/src python - <<'PY'
          from divar_scanner.pipeline import run_pipeline
          print("Colab-style import OK:", run_pipeline.__name__)
          PY

  decision-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[decision]'
      - name: Import Laya runtime without downloading model weights
        run: |
          python - <<'PY'
          import laya
          from divar_scanner.decision import resolve_model_specs
          from divar_scanner.laya_backend import LayaDecisionEngine, adapt_questions_for_laya

          spec = resolve_model_specs("laya-multilingual", {})[0]
          assert spec.engine == "laya"
          assert spec.model_name == "convaiinnovations/laya"

          questions = {
              "q": {
                  "type": "noul",
                  "instructions": "آیا شواهد کافی است؟",
                  "criteria": {"no": "خیر", "yes": "بله"},
              }
          }
          adapted, meta = adapt_questions_for_laya(questions)
          assert adapted["q"]["type"] == "choice"
          assert meta["q"]["type"] == "noul"
          engine = LayaDecisionEngine()
          assert engine.backend_name == "laya-multilingual"
          print("Laya import/runtime adapter OK:", getattr(laya, "__version__", "unknown"))
          PY

  browser-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[browser]'
      - name: Import browser crawler without launching Divar
        run: |
          python - <<'PY'
          import playwright
          from divar_scanner.browser_crawler import normalize_dom_cards
          from divar_scanner.cli import build_parser

          rows = [{
              "href": "/v/test/AbCd1234",
              "text": "آپارتمان ۸۵ متری دو خواب\nودیعه ۸۰۰ میلیون\nاجاره ۱۵ میلیون",
          }]
          cards = normalize_dom_cards(rows)
          assert cards[0]["area_hint"] == 85
          assert cards[0]["rooms_hint"] == 2

          args = build_parser().parse_args(["acquire", "--transport", "browser"])
          assert args.command == "acquire"
          assert args.transport == "browser"
          print("Playwright/browser acquisition adapter OK")
          PY
