[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "divar-scanner"
version = "0.1.0"
description = "Divar Tehran rental crawler and anomaly/suspicion analysis pipeline"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "divar_scanner contributors"}]
dependencies = [
  "requests>=2.31",
  "PyYAML>=6.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
  "pyarrow>=14.0",
  "plotly>=5.18",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]

[project.scripts]
divar-scanner = "divar_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
