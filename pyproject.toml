[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "divar-scanner"
version = "0.4.1"
description = "Divar Tehran rental anomaly scanner with Jev-style non-generative decision models"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "divar_scanner contributors"}]
dependencies = [
  "requests>=2.31,<3",
  "PyYAML>=6.0,<7",
  "pandas>=2.0,<3",
  "numpy>=1.24,<3",
  "scikit-learn>=1.3,<2",
  "tqdm>=4.66,<5",
  "pyarrow>=14,<23",
  "plotly>=5.18,<7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9", "ruff>=0.6,<1"]
decision = [
  "laya>=0.3.21,<0.4",
  "torch>=2.2",
  "transformers>=4.48,<6",
  "sentencepiece>=0.2,<1",
]

[project.scripts]
divar-scanner = "divar_scanner.cli:main"
divar-scanner-doctor = "divar_scanner.doctor:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["divar_scanner*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
